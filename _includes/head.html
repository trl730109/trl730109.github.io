<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% assign page_title = page.title | strip %}
  {% if page_title != "" %}
    <title>{{ page_title }} · {{ site.title }}</title>
  {% else %}
    <title>{{ site.title }} · {{ site.tagline }}</title>
  {% endif %}
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="author" content="{{ site.author.name }}">

  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" type="image/x-icon" href="{{ '/images/favicon.ico' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">

  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  {% feed_meta %}
  {% seo title=false %}
</head>
