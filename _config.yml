title:            "Zichen Tang"
tagline:          "First-year PhD, HKUST CSE"
description:      "Personal homepage of Zichen Tang, first-year PhD student in Computer Science and Engineering at HKUST, working on data-centric approaches to large language models."
url:              "https://trl730109.github.io"
baseurl:          ""
repository:       "trl730109/trl730109.github.io"
locale:           "en-US"
lang:             "en"

author:
  name:           "Zichen Tang"
  role:           "First-year PhD, Computer Science and Engineering"
  affiliation:    "Hong Kong University of Science and Technology"
  affiliation_short: "HKUST"
  email:          "ztangap@cse.ust.hk"  # TODO: confirm preferred email — old MPhil mail was ztangap@connect.hkust-gz.edu.cn
  location:       "Hong Kong"
  github:         "trl730109"
  googlescholar:  "https://scholar.google.com/citations?user=i4BgXlsAAAAJ&hl=en"
  cv_pdf:         "/files/CV_TANG_Zichen.pdf"

collections:
  publications:
    output: false
  teaching:
    output: false

defaults:
  - scope:
      path: ""
    values:
      layout: page

permalink: /:path/

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor
  - .github
  - .gitignore
  - node_modules

sass:
  style: compressed
  sass_dir: _sass

markdown: kramdown
kramdown:
  smart_quotes: ["apos", "apos", "quot", "quot"]
  input: GFM
  hard_wrap: false
